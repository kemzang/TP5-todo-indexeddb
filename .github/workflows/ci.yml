name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Tests unitaires (TDD - Vitest)
        run: npm run test

      - name: Tests comportementaux (BDD - Cucumber)
        run: npm run test:bdd

      - name: Installation des navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout (E2E - Playwright)
        run: npm run test:e2e

      # Rapports HTML telechargeables depuis la page du run (meme en cas d'echec)
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rapports-de-tests
          path: |
            reports/
            playwright-report/
          retention-days: 7
