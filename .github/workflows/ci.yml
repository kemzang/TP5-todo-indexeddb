name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Tests unitaires (TDD - Vitest) avec couverture de code
        run: npm run test:coverage

      - name: Tests de mutation (StrykerJS)
        run: npm run test:mutation

      - name: Tests comportementaux (BDD - Cucumber)
        run: npm run test:bdd

      - name: Installation des navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Scenarios BDD executes dans le navigateur (Cucumber + Playwright)
        run: npm run test:bdd:ui

      - name: Tests de bout en bout (E2E - Playwright)
        run: npm run test:e2e

      # Rapports HTML telechargeables depuis la page du run (meme en cas d'echec)
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-de-tests
          path: |
            reports/
            playwright-report/
          retention-days: 7

  # Tests de performance k6 : lances seulement si tous les tests fonctionnels sont verts.
  # Un seuil (threshold) viole fait echouer k6, donc ce job, donc le pipeline.
  performance:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: grafana/setup-k6-action@v1

      - name: Test de charge HTTP (k6)
        run: npm run perf:charge
        env:
          K6_MODE: local # binaire k6 installe par setup-k6-action

      # Image Docker officielle grafana/k6:latest-with-browser (Chromium inclus),
      # identique a l'execution locale : le Chrome du runner plante sous k6.
      - name: Test de performance dans le navigateur (k6 browser)
        run: npm run perf:navigateur

      - name: Installation de Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Profilage (CPU, memoire) et detection de fuite memoire
        run: npm run profil

      - name: Rapports k6 et profil de performance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-performance
          path: |
            reports/k6-*.html
            reports/profil-*.json
          retention-days: 7
